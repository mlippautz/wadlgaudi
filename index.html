<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wadlgaudi - Activity Analyzer</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <!-- Configuration -->
  <script src="config.js"></script>
  <script type="module" crossorigin src="/wadlgaudi/assets/index-BI00PRQ1.js"></script>
  <link rel="stylesheet" crossorigin href="/wadlgaudi/assets/index-4bvCcJzk.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-brand">
        <h1 class="brand-title">Wadlgaudi</h1>
      </div>
      <div class="header-controls">
        <div class="controls-actions">
          <!-- Add activities button -->
          <button id="btn-add-files" class="btn btn-sm btn-accent">Add Activities</button>
          <input type="file" id="file-upload" accept=".fit" multiple hidden>

          <!-- Sync status indicator -->
          <span id="sync-status" class="sync-status hidden"></span>

          <!-- Auth button (visible when disconnected) -->
          <button id="btn-auth" class="btn btn-sm btn-primary">Connect Drive</button>

          <!-- Disconnect button (visible when connected) -->
          <button id="btn-signout" class="btn btn-sm btn-outline hidden">Disconnect</button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <!-- Missing Credentials State -->
      <div id="state-credentials-missing" class="state-view">
        <div class="prompt-icon">⚠️</div>
        <h2 class="prompt-title">Configuration Required</h2>
        <p class="error-text">API credentials missing. Please configure <code>config.js</code>.</p>
      </div>

      <!-- Empty State -->
      <div id="state-empty" class="state-view hidden">
        <div class="prompt-icon">📂</div>
        <h2 class="prompt-title">Add Your Activities</h2>
        <p class="prompt-desc">Drop .fit files here or click "Add Activities" to get started.</p>
      </div>

      <!-- Loading State -->
      <div id="state-loading" class="state-view hidden">
        <div class="spinner"></div>
        <p class="loading-text">Loading activities from Google Drive...</p>
      </div>

      <!-- Dashboard View (Folder and File List) -->
      <div id="dashboard-view" class="dashboard-view hidden">
        <div class="dashboard-content">
          <!-- Files List Sidebar -->
          <aside class="sidebar">
            <h3 class="sidebar-title">Activities</h3>
            <div class="sidebar-controls">
              <div class="search-wrapper">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search activities..." autocomplete="off" spellcheck="false">
                <button id="btn-clear-search" class="btn-clear-search" type="button" title="Clear search">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
              <div class="shortcut-buttons">
                <button id="btn-this-year" class="btn-shortcut" type="button">Year</button>
                <button id="btn-this-month" class="btn-shortcut" type="button">Month</button>
                <button id="btn-clear" class="btn-shortcut" type="button">Clear</button>
              </div>
              <div class="shortcut-buttons sport-filters">
                <button id="btn-sport-all" class="btn-shortcut active" type="button">All</button>
                <button id="btn-sport-running" class="btn-shortcut sport-btn-running" type="button">Running</button>
                <button id="btn-sport-cycling" class="btn-shortcut sport-btn-cycling" type="button">Cycling</button>
                <button id="btn-sport-skiing" class="btn-shortcut sport-btn-skiing" type="button">Skiing</button>
              </div>
            </div>
            <div class="sidebar-info">
              <span id="filter-status" class="filter-status"></span>
              <span id="storage-used" class="storage-indicator" title="Local storage used"></span>
            </div>
            <div class="sidebar-aggregate">
              <span id="km-aggregate" class="km-aggregate"></span>
            </div>
            <div class="files-list-container">
              <ul id="files-list" class="files-list">
                <!-- Populated dynamically -->
              </ul>
            </div>
          </aside>

          <!-- Map View Main Area -->
          <section class="map-view">
            <div id="map" class="map-container"></div>
          </section>
        </div>

        <!-- Floating View Toggle Button (Mobile Only) -->
        <button id="btn-view-toggle" class="btn-view-toggle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          <span id="toggle-text">Show Map</span>
        </button>
      </div>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Main JS -->
</body>
</html>
